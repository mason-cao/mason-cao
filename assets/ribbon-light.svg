<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <style>
    /* Anchors the scaling to the bottom of the viewBox so bars grow upward */
    .bar {
      transform-origin: center 120px;
    }

    /* Subtle sweeping wave for baseline data */
    @keyframes environmental-sweep {
      0%, 100% { opacity: 0.5; transform: scaleY(0.98); }
      50% { opacity: 1; transform: scaleY(1.05); }
    }

    /* Aggressive pulse for the anomaly spikes */
    @keyframes anomaly-pulse {
      0%, 100% { fill: #f85149; opacity: 0.8; transform: scaleY(1); }
      50% { fill: #ff7b72; opacity: 1; transform: scaleY(1.1); }
    }

    /* Assigning classes to colors and animations */
    .safe { fill: #d0d7de; animation: environmental-sweep 4s ease-in-out infinite; }
    .warn { fill: #d29922; animation: environmental-sweep 4s ease-in-out infinite; }
    .danger { animation: anomaly-pulse 2s ease-in-out infinite; }
  </style>

  <!-- BASELINE (Grey) -->
  <rect class="bar safe" x="4" y="105" width="12" height="15" rx="3" style="animation-delay: 0.0s"/>
  <rect class="bar safe" x="24" y="100" width="12" height="20" rx="3" style="animation-delay: 0.1s"/>
  <rect class="bar safe" x="44" y="102" width="12" height="18" rx="3" style="animation-delay: 0.2s"/>
  <rect class="bar safe" x="64" y="95" width="12" height="25" rx="3" style="animation-delay: 0.3s"/>
  <rect class="bar safe" x="84" y="98" width="12" height="22" rx="3" style="animation-delay: 0.4s"/>
  <rect class="bar safe" x="104" y="105" width="12" height="15" rx="3" style="animation-delay: 0.5s"/>
  <rect class="bar safe" x="124" y="101" width="12" height="19" rx="3" style="animation-delay: 0.6s"/>
  <rect class="bar safe" x="144" y="99" width="12" height="21" rx="3" style="animation-delay: 0.7s"/>
  <rect class="bar safe" x="164" y="105" width="12" height="15" rx="3" style="animation-delay: 0.8s"/>
  
  <!-- LONG EPISODE (Amber) -->
  <rect class="bar warn" x="184" y="80" width="12" height="40" rx="3" style="animation-delay: 0.9s"/>
  <rect class="bar warn" x="204" y="75" width="12" height="45" rx="3" style="animation-delay: 1.0s"/>
  <rect class="bar warn" x="224" y="65" width="12" height="55" rx="3" style="animation-delay: 1.1s"/>
  <rect class="bar warn" x="244" y="70" width="12" height="50" rx="3" style="animation-delay: 1.2s"/>
  <rect class="bar warn" x="264" y="60" width="12" height="60" rx="3" style="animation-delay: 1.3s"/>
  <rect class="bar warn" x="284" y="55" width="12" height="65" rx="3" style="animation-delay: 1.4s"/>
  <rect class="bar warn" x="304" y="62" width="12" height="58" rx="3" style="animation-delay: 1.5s"/>
  <rect class="bar warn" x="324" y="65" width="12" height="55" rx="3" style="animation-delay: 1.6s"/>
  
  <!-- SPIKE 1 (Red) -->
  <rect class="bar danger" x="344" y="35" width="12" height="85" rx="3" style="animation-delay: 1.7s"/>
  <rect class="bar danger" x="364" y="20" width="12" height="100" rx="3" style="animation-delay: 1.8s"/>
  <rect class="bar danger" x="384" y="40" width="12" height="80" rx="3" style="animation-delay: 1.9s"/>
  
  <!-- RECOVERY -->
  <rect class="bar warn" x="404" y="70" width="12" height="50" rx="3" style="animation-delay: 2.0s"/>
  <rect class="bar safe" x="424" y="95" width="12" height="25" rx="3" style="animation-delay: 2.1s"/>
  <rect class="bar safe" x="444" y="100" width="12" height="20" rx="3" style="animation-delay: 2.2s"/>
  <rect class="bar safe" x="464" y="105" width="12" height="15" rx="3" style="animation-delay: 2.3s"/>
  <rect class="bar safe" x="484" y="102" width="12" height="18" rx="3" style="animation-delay: 2.4s"/>
  <rect class="bar safe" x="504" y="98" width="12" height="22" rx="3" style="animation-delay: 2.5s"/>
  <rect class="bar safe" x="524" y="105" width="12" height="15" rx="3" style="animation-delay: 2.6s"/>
  <rect class="bar safe" x="544" y="96" width="12" height="24" rx="3" style="animation-delay: 2.7s"/>
  
  <!-- SPIKE 2 (Red) -->
  <rect class="bar warn" x="564" y="65" width="12" height="55" rx="3" style="animation-delay: 2.8s"/>
  <rect class="bar danger" x="584" y="30" width="12" height="90" rx="3" style="animation-delay: 2.9s"/>
  <rect class="bar danger" x="604" y="45" width="12" height="75" rx="3" style="animation-delay: 3.0s"/>
  <rect class="bar warn" x="624" y="75" width="12" height="45" rx="3" style="animation-delay: 3.1s"/>
  
  <!-- RETURN TO BASELINE (Grey) -->
  <rect class="bar safe" x="644" y="90" width="12" height="30" rx="3" style="animation-delay: 3.2s"/>
  <rect class="bar safe" x="664" y="100" width="12" height="20" rx="3" style="animation-delay: 3.3s"/>
  <rect class="bar safe" x="684" y="105" width="12" height="15" rx="3" style="animation-delay: 3.4s"/>
  <rect class="bar safe" x="704" y="102" width="12" height="18" rx="3" style="animation-delay: 3.5s"/>
  <rect class="bar safe" x="724" y="98" width="12" height="22" rx="3" style="animation-delay: 3.6s"/>
  <rect class="bar safe" x="744" y="106" width="12" height="14" rx="3" style="animation-delay: 3.7s"/>
  <rect class="bar safe" x="764" y="99" width="12" height="21" rx="3" style="animation-delay: 3.8s"/>
  <rect class="bar safe" x="784" y="104" width="12" height="16" rx="3" style="animation-delay: 3.9s"/>
</svg>
